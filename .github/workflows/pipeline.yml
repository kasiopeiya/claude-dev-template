# 責務: topic ブランチへの push から、マージ可否の判定までを担う唯一のパイプライン。
#       dev への deploy は担わない（マージ後の deploy-dev.yml が担う）。
# なぜこの構成なのかは docs/design/cicd-design.md を参照する。

name: pipeline
run-name: pipeline (${{ github.ref_name }})

# git-policy の7プレフィックスのみを対象にし、ブランチ命名規約を仕組みで強制する。
# 代償として、これ以外のブランチは checks が1つも走らず無言でマージ不可になる（cicd-design「既知の制約」）。
# workflow レベルの paths フィルタは使わない。ワークフローごとスキップされると required check が
# pending のまま残り、PR が永久にマージできなくなるため（job レベルの skip とは挙動が違う）。
on:
  push:
    branches:
      - 'feat**'
      - 'fix**'
      - 'refactor**'
      - 'chore**'
      - 'ci**'
      - 'test**'
      - 'docs**'
      # Dependabot は dependabot/github_actions/... を切る。7プレフィックスのどれにも
      # 当たらないため、足さないとその PR は checks が走らず無言でマージ不可になる。
      - 'dependabot**'

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-pull-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # --fill は base..head 間のコミットを local git から読むため、全履歴が要る
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # 重複判定はタイトルではなくブランチで行う。--fill はコミットごとにタイトルが変わるため、
      # タイトル検索だと毎 push で新しい PR ができてしまう。
      - name: Create pull request if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "pull request already exists for $BRANCH"
            exit 0
          fi
          # 本文はコミットメッセージから生成する。git-policy が既にコミットへ「なぜ」を
          # 書くことを義務付けており、同じ内容を人間に2度書かせないため（--fill）。
          gh pr create --base main --head "$BRANCH" --fill

  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      app_changed: ${{ steps.detect.outputs.app_changed }}
      cdk_changed: ${{ steps.detect.outputs.cdk_changed }}
    steps:
      # merge-base を求めるため全履歴が要る
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        run: |
          changed=$(git diff --name-only origin/main...HEAD)
          echo "changed files:"
          echo "$changed"

          if [ -z "$changed" ]; then
            # 判定材料が無いときは検査を省かない側へ倒す
            docs_only=false
          elif grep -qvE '^(docs/|[^/]*\.md$)' <<< "$changed"; then
            docs_only=false
          else
            docs_only=true
          fi

          if grep -qE '^app/' <<< "$changed"; then app_changed=true; else app_changed=false; fi
          if grep -qE '^infra/' <<< "$changed"; then cdk_changed=true; else cdk_changed=false; fi

          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"
          echo "app_changed=$app_changed" | tee -a "$GITHUB_OUTPUT"
          echo "cdk_changed=$cdk_changed" | tee -a "$GITHUB_OUTPUT"

  # prettier は .md も検査対象にしており、docs_only でも整形崩れを検出する必要があるため
  # ci-common から切り出し常に実行する。root の依存だけで完結し型情報を要らないので、
  # 3階層分の npm ci が要る ci-common と違い軽量に保てる（cicd-design）。
  ci-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run format:check

  # policy hook（.claude/hooks/policy-loader.mjs）の回帰検査。docs/policy の frontmatter だけを
  # 直す PR は docs_only 判定で ci-common がスキップされるため、その中に置くと「hook を壊す変更で
  # こそ検査が走らない」。ci-format と同じ理由で、変更種別に関わらず常に実行する独立ジョブにする。
  # root の依存だけで完結し軽量（ci-format と同型）。
  ci-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run test:hooks

  # Markdown の相対リンク切れ検査。ci-format・ci-hooks と同じ「常に実行する軽量ジョブ」で、
  # 理由は cicd-design を参照する。検査スクリプトが外部依存を使わないため npm ci も要らない。
  ci-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm run check:links

  # CLAUDE.md（@ import 先を含む）の文字数上限の検査。ci-format・ci-hooks・ci-links と同じ
  # 「常に実行する軽量ジョブ」で、理由は cicd-design を参照する。CLAUDE.md だけを直す PR は
  # docs_only 判定になるため、ci-common に置くと上限を破る変更でこそ走らない。
  # 検査スクリプトが外部依存を使わないため npm ci も要らない。
  ci-claude-md:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npm run check:claude-md

  # リポジトリ全体を1回で舐めるツール。静的解析はルールを1箇所で定義しているため
  # 階層ごとに分割・スキップできない（cicd-design）。
  ci-common:
    needs: detect-changes
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # キャッシュキーはジョブのスコープごとに分ける。cache-dependency-path が
      # キーのハッシュ元になるため、参照する lock ファイルが違えばキーも分かれる。
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            samples/app/backend/package-lock.json
            samples/infra/package-lock.json

      # eslint.config.mjs の型対応 lint（projectService: true）が TS の型情報を要求するため、
      # 3階層すべての node_modules が揃っていないと動かない。共通だから軽い、は誤り。
      # 現在この階層は samples/ にしか無い。app/・infra/ に実装を置いたら、その分をここへ足す。
      - run: npm ci
      - run: npm ci
        working-directory: samples/app/backend
      - run: npm ci
        working-directory: samples/infra
      # プロジェクトのコーディング規約の適用
      - run: npm run lint
      # 未使用のexport・未使用のファイル・未使用の依存パッケージなどを検出
      - run: npm run knip

      # 3階層の npm 依存を舐めて high 以上で落とす。どこを検査するか・どこで落とすか・
      # 上流が同梱していて手元で直せないものをどう扱うかは scripts/audit-dependencies.mjs にある。
      - run: npm run check:audit

  # app 固有の検査。ルールが app/backend に閉じているため条件実行できる（ci-common との違い）。
  ci-app:
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - run: npm ci
        working-directory: app/backend
      - run: npm run typecheck
        working-directory: app/backend
      # 単体テストに加え、レイヤー依存・循環依存・凝集度(LCOM)のアーキテクチャ規約テスト（archunit）も実行
      - run: npm run test
        working-directory: app/backend

  # cdk 固有の検査。
  ci-cdk:
    needs: detect-changes
    if: needs.detect-changes.outputs.cdk_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci
        working-directory: infra
      # 合成したCloudFormationテンプレート全体をスナップショットと比較し、意図しない差分を検知
      - run: npm run test:snap
        working-directory: infra
      # 暗号化設定・アラーム有無など、リソースの個別プロパティをピンポイントで検査（fine-grained assertions）
      - run: npm run test:fga
        working-directory: infra

  # PR の時点では deploy せず、cdk diff だけをレビューの材料として出す。
  # deploy はマージ後（deploy-dev.yml）へ移した。ここは read-only なので dev を奪わず、
  # 直列化の待ちも作らない（concurrency を付けないのはこのため）。
  # cicd-gate には繋がない——実環境への疎通をマージ可否に持ち込むと AWS 側の一時障害で
  # マージが止まる。diff は判断材料であって合否ではない（cicd-design「重要なポイント」）。
  # app 変更でも走らせるのは、アプリを CDK が deploy する構成では app の変更も差分に出るため。
  cdk-diff:
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true' || needs.detect-changes.outputs.cdk_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC で AWS へ認証するために必要（下の AWS 認証ステップと対）
      # id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json

      # cdk コマンドは infra/ の依存にしか存在しない
      - run: npm ci
        working-directory: infra

      # AWS アカウント・OIDC ロール・secrets.ROLE_TO_ASSUME が無いため、認証ステップが必ず落ちる。
      # advisory なので cicd-gate は赤くならないが、毎回失敗するジョブは誰も見なくなるためコメントアウトしている。
      # 有効化には OIDC ロールの構築が要る。
      #
      # - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      #   with:
      #     role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
      #     aws-region: ap-northeast-1
      #
      # # diff 対象は devParameter.prefix（infra/parameter.ts）由来のスタック名で選ぶ。
      # # bin/app.ts は dev/stg/prd の3環境すべてを synth するため、対象の絞り込みが要る。
      # - name: Show cdk diff in job summary
      #   working-directory: infra
      #   env:
      #     ACCOUNT_ID: ${{ secrets.DEV_ACCOUNT_ID }}
      #     STACK_NAME: pdd-dev-*
      #   run: |
      #     {
      #       echo '## cdk diff'
      #       echo '```'
      #       npx cdk diff "$STACK_NAME" 2>&1
      #       echo '```'
      #     } >> "$GITHUB_STEP_SUMMARY"

  # マージ可否を決める唯一の required check。
  # GitHub は「実行しなかった」を「成功」と同じものとして扱うため、上流に needs で繋ぐだけの
  # ゲートは検査が丸ごと走らなかったときに赤くならずに静かに開く。
  # 未実行は検証の不在であって、検証の成功ではない（cicd-design）。
  # cdk-diff だけは意図的に needs へ入れない。マージ可否は実 AWS 環境に触れずに決まるもので
  # 判定する（cicd-design）ため、AWS 側の一時障害でここが赤くならないようにしている。
  cicd-gate:
    needs:
      [
        create-pull-request,
        detect-changes,
        ci-format,
        ci-hooks,
        ci-links,
        ci-claude-md,
        ci-common,
        ci-app,
        ci-cdk
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify upstream job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          # skipped は許す。上流が落ちて連鎖的に skipped になった場合でも、
          # 落ちたジョブ自身が failure として needs に現れるため取りこぼさない。
          bad=$(jq -r 'to_entries[]
            | select(.value.result == "failure" or .value.result == "cancelled")
            | "\(.key): \(.value.result)"' <<< "$NEEDS")

          if [ -n "$bad" ]; then
            echo "::error::upstream jobs did not pass"
            echo "$bad"
            exit 1
          fi
          echo "all upstream jobs passed or were intentionally skipped"
