# 責務: main に入った変更を dev 環境へ deploy し、結合テストを実行する。
#       失敗したら GitHub Issue を起票して、壊れた main に持ち主を作る。
# なぜこの構成なのかは docs/design/cicd-design.md を参照する。

name: deploy-dev
run-name: deploy-dev (${{ github.sha }})

# main に入った内容だけを dev へ流す。dev へ deploy する経路はここ1本だけで、
# トピックブランチからの手動 deploy は用意しない（cicd-design「前提と制約」）。
# paths で対象を絞れるのは、このワークフローが required check ではないため
# （pipeline.yml と違い、スキップしてもマージ判定が pending のまま残らない）。
# paths の対象は pipeline.yml の detect-changes（`^app/`・`^infra/`）と一致させること。
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'infra/**'
      - '.github/workflows/deploy-dev.yml'

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # app 変更でも deploy する。アプリは CDK が deploy するため、変更を反映するには deploy が要る。
  cdk-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # dev は1環境しかない。main への push が続いたときと、スケジュール実行の destroy との間で
    # 直列化しないと CloudFormation スタックが壊れる。実行中の deploy は中断させない。
    # グループ名は dev-destroy.yml と完全一致させること。
    concurrency:
      group: cdk-deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      # OIDC で AWS へ認証するために必要。下の AWS 認証と同時に解除する（#31）
      # id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ここから下は #31（OIDC ロールの構築）の完了まで動かせないため、コメントアウトしている。
      # AWS アカウント・OIDC ロール・secrets.ROLE_TO_ASSUME がまだ無く、認証ステップが必ず落ちる。
      # infra/ もまだ無いため、その依存を要る setup-node と npm ci も同じく動かせない。
      # #31 の完了後、この段落全体のコメントを外し、上の id-token: write も併せて解除する。
      #
      # - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      #   with:
      #     node-version: 24
      #     cache: npm
      #     cache-dependency-path: infra/package-lock.json
      #
      # # cdk コマンドは infra/ の依存にしか存在しない
      # - run: npm ci
      #   working-directory: infra
      #
      # - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      #   with:
      #     role-to-assume: ${{ secrets.ROLE_TO_ASSUME }}
      #     aws-region: ap-northeast-1
      #
      # # deploy 対象は devParameter.prefix（infra/parameter.ts）由来のスタック名で選ぶ。
      # # bin/app.ts は dev/stg/prd の3環境すべてを synth するため、対象の絞り込みが要る。
      # - working-directory: infra
      #   env:
      #     ACCOUNT_ID: ${{ secrets.DEV_ACCOUNT_ID }}
      #     STACK_NAME: pdd-dev-*
      #   run: npx cdk deploy --require-approval never "$STACK_NAME"

  # 器だけ置く。検証する対象がまだ無いため中身は空（#31 完了後の deploy が前提）。
  integration-test:
    needs: cdk-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - run: echo "no integration tests yet"

  # deploy はマージの後ろにあるため、失敗しても required check は赤くならない。
  # 誰も見ない赤いランとして滞留し、壊れた main が全ブランチへ配られるのを防ぐため、
  # 失敗に持ち主を作る（cicd-design「重要なポイント」）。
  report-failure:
    needs: [cdk-deploy, integration-test]
    # cancelled は対象にしない。直列化の押し出しで消えた実行は、後続の deploy が引き継ぐため。
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # gh issue create / gh label create に必要
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # checkout の代わりにリポジトリ文脈をここで渡す（gh はこれだけで動く）
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="main への deploy が失敗した。dev 環境は main の姿を映していない。

          - コミット: $SHA
          - 実行ログ: $RUN_URL

          原因を確認し、直す変更を main へ入れる（roll forward）。
          原因が AWS 側の一時障害なら、このワークフローを再実行する。"

          # 連続で失敗しても Issue を量産しない。open な既存 Issue があればコメントを足す。
          existing=$(gh issue list --label dev-deploy-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            exit 0
          fi

          # ラベルが未作成のリポジトリでも動くよう、無ければ作る（既存なら何もしない）。
          gh label list --limit 200 --json name --jq '.[].name' | grep -qx 'dev-deploy-failure' ||
            gh label create dev-deploy-failure --description "dev への deploy が失敗した" --color B60205

          gh issue create \
            --title "dev への deploy が失敗した" \
            --label dev-deploy-failure \
            --body "$body"
